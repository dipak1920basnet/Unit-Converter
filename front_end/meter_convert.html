<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
</head>
<body>

    <h1>Length Converter</h1>

    <form action="" method="POST">

        <label for="unit_length">Unit Value:</label>
        <input type="number" name="unit_length" id="unit_length" step="any" required>

        <br><br>

        <label for="from_unit">From:</label>
        <select name="from_unit" id="from_unit">
            <option value="mm">Millimeter (mm)</option>
            <option value="cm">Centimeter (cm)</option>
            <option value="m">Meter (m)</option>
            <option value="km">Kilometer (km)</option>
            <option value="in">Inch (in)</option>
            <option value="ft">Foot (ft)</option>
            <option value="yd">Yard (yd)</option>
            <option value="mi">Mile (mi)</option>
        </select>

        <br><br>

        <label for="to_unit">To:</label>
        <select name="to_unit" id="to_unit">
            <option value="mm">Millimeter (mm)</option>
            <option value="cm">Centimeter (cm)</option>
            <option value="m">Meter (m)</option>
            <option value="km">Kilometer (km)</option>
            <option value="in">Inch (in)</option>
            <option value="ft">Foot (ft)</option>
            <option value="yd">Yard (yd)</option>
            <option value="mi">Mile (mi)</option>
        </select>

        <br><br>

        <button type="submit">Convert</button>

    </form>

</body>
</html>
