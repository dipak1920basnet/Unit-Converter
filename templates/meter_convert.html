<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<header>
    <a href="meter_convert.html"> Length Converter</a>
    <a href="weight.html"> Weight Converter</a>
    <a href="temperature.html"> Temperature Converter</a>
</header>

<body>

    <form action="http://localhost:8000/length_convert" method="POST">

        <h1>Length Converter</h1>

        <label for="value">Unit Value:</label>
        <input type="number" name="value" id="value" step="any" required>

        <br><br>

        <label for="froms">From:</label>
        <select name="froms" id="froms">
            <option value="mm">Millimeter (mm)</option>
            <option value="cm">Centimeter (cm)</option>
            <option value="m">Meter (m)</option>
            <option value="km">Kilometer (km)</option>
            <option value="in">Inch (in)</option>
            <option value="ft">Foot (ft)</option>
            <option value="yd">Yard (yd)</option>
            <option value="mi">Mile (mi)</option>
        </select>

        <br><br>

        <label for="to">To:</label>
        <select name="to" id="to">
            <option value="mm">Millimeter (mm)</option>
            <option value="cm">Centimeter (cm)</option>
            <option value="m">Meter (m)</option>
            <option value="km">Kilometer (km)</option>
            <option value="in">Inch (in)</option>
            <option value="ft">Foot (ft)</option>
            <option value="yd">Yard (yd)</option>
            <option value="mi">Mile (mi)</option>
        </select>

        <br><br>

        <div class="result">
            <h2>Result</h2>
            <p>10 km = 6.21371 mi</p>
        </div>
    
        <br>
        
        <button type="submit">Convert</button>
        <br><br>
        <button type="reset">Reset</button>

    </form>


</body>
</html>
